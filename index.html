    <!-- FIREBASE & APP JAVASCRIPT -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAtpOpXsNnr7GFhA5IRHNmhvTnAT6MJ8JI",
            authDomain: "manager-cd77a.firebaseapp.com",
            projectId: "manager-cd77a",
            storageBucket: "manager-cd77a.firebasestorage.app",
            messagingSenderId: "48899812710",
            appId: "1:48899812710:web:d234250f3bbca1765eeca7",
            measurementId: "G-5E6SW536CV"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = localStorage.getItem('activeUser') || null;
        let currentuserDataCache = { monthlyBudget: 40000, dailyLimit: 1000, expenses: [] };
        let chartInstances = {};

        // THEME TOGGLE
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.className = 'fa-solid fa-sun text-sm text-amber-500';
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.className = 'fa-solid fa-moon text-sm';
            }
            renderAllData();
        }

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun text-sm text-amber-500';
        }

        function autoSelectCategory() {
            const val = document.getElementById('expTitle').value.toLowerCase().trim();
            const catSelect = document.getElementById('expCategory');
            if (!val) return;

            if (val.includes('petrol') || val.includes('fuel') || val.includes('bike') || val.includes('car') || val.includes('uber')) {
                catSelect.value = 'Petrol & Transport';
            } else if (val.includes('book') || val.includes('note') || val.includes('pen') || val.includes('course')) {
                catSelect.value = 'Books & Education';
            } else if (val.includes('nashta') || val.includes('snack') || val.includes('tea') || val.includes('chai')) {
                catSelect.value = 'Snacks & Tea';
            } else if (val.includes('lunch') || val.includes('dinner') || val.includes('khana') || val.includes('biryani') || val.includes('burger')) {
                catSelect.value = 'Food & Mess';
            } else if (val.includes('shirt') || val.includes('pant') || val.includes('shoes') || val.includes('shopping')) {
                catSelect.value = 'Shopping & Clothes';
            } else if (val.includes('bill') || val.includes('net') || val.includes('wifi') || val.includes('recharge')) {
                catSelect.value = 'Bills & Utilities';
            }
        }

        function shareOnWhatsApp() {
            let userData = currentuserDataCache;
            if (!userData || !userData.expenses || userData.expenses.length === 0) {
                alert('No expense records available to share!');
                return;
            }

            let budget = userData.monthlyBudget || 0;
            let expenses = userData.expenses;
            let now = new Date();
            let totalSpent = 0;
            let recentListText = "";

            expenses.forEach((item) => {
                totalSpent += Number(item.amount);
                recentListText += `• ${item.title} (${item.category}): Rs. ${Number(item.amount).toLocaleString()}\n`;
            });

            let text = `📊 *Cloud Expense Summary - ${currentUser}*\n`;
            text += `🗓️ Month: ${now.toLocaleString('default', { month: 'long' })} ${now.getFullYear()}\n`;
            text += `💰 *Monthly Budget:* Rs. ${budget.toLocaleString()}\n`;
            text += `💸 *Total Spent:* Rs. ${totalSpent.toLocaleString()}\n`;
            text += `💼 *Remaining:* Rs. ${(budget - totalSpent).toLocaleString()}\n\n`;
            text += `📝 *Recent Transactions:*\n${recentListText}\n`;
            text += `\n_Created by Abdul Haseeb Sajjad_`;

            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        // CLOUD DB SYNC FUNCTIONS
        async function fetchUserDataFromCloud(username) {
            try {
                let docRef = db.collection('users').doc(username);
                let doc = await docRef.get();
                if (doc.exists) {
                    currentuserDataCache = doc.data();
                    return true;
                }
                return false;
            } catch (err) {
                console.error("Cloud Error:", err);
                alert("Cloud connection error! Check your internet or Firebase config.");
                return false;
            }
        }

        async function saveUserDataToCloud(targetUser = currentUser) {
            if (!targetUser) return;
            try {
                await db.collection('users').doc(targetUser).set(currentuserDataCache);
            } catch (err) {
                console.error("Cloud Save Error:", err);
            }
        }

        // AUTH TAB SWITCHING
        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('tabLogin').className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-cyan-500 text-slate-950 transition';
                document.getElementById('tabRegister').className = 'flex-1 py-2 text-xs font-semibold text-slate-400 rounded-lg hover:text-white transition';
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('tabRegister').className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-cyan-500 text-slate-950 transition';
                document.getElementById('tabLogin').className = 'flex-1 py-2 text-xs font-semibold text-slate-400 rounded-lg hover:text-white transition';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('regUsername').value.trim();
            const p = document.getElementById('regPassword').value;

            let exists = await fetchUserDataFromCloud(u);
            if (exists) {
                alert('Username already exists in Cloud database!');
                return;
            }

            currentuserDataCache = {
                password: p,
                monthlyBudget: 40000,
                dailyLimit: 1000,
                expenses: []
            };

            await saveUserDataToCloud(u);
            alert('Cloud account created successfully! Please login.');
            switchAuthTab('login');
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value;

            let found = await fetchUserDataFromCloud(u);
            if (found && currentuserDataCache.password === p) {
                currentUser = u;
                localStorage.setItem('activeUser', u);
                initDashboard();
            } else {
                alert('Invalid Username or Password!');
            }
        });

        function logout() {
            localStorage.removeItem('activeUser');
            currentUser = null;
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('authContainer').classList.remove('hidden');
        }

        async function initDashboard() {
            await fetchUserDataFromCloud(currentUser);
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('authContainer').classList.remove('hidden');
            // If valid, show dashboard
            if (currentUser) {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('userDisplayName').innerText = `Smart Financial Expense Manager (${currentUser})`;
                renderAllData();
            }
        }

        function renderAllData() {
            let userData = currentuserDataCache;
            let budget = userData.monthlyBudget || 0;
            let dLimit = userData.dailyLimit || 0;
            let expenses = userData.expenses || [];

            let now = new Date();
            let todayStr = now.toLocaleDateString('en-GB');

            let totalSpent = 0;
            let todaySpent = 0;
            let categoryTotals = {};

            expenses.forEach(e => {
                totalSpent += Number(e.amount);
                if (e.date === todayStr) {
                    todaySpent += Number(e.amount);
                }
                categoryTotals[e.category] = (categoryTotals[e.category] || 0) + Number(e.amount);
            });

            document.getElementById('displayMonthlyBudget').innerText = 'Rs. ' + budget.toLocaleString();
            document.getElementById('displayTotalSpent').innerText = 'Total Spent: Rs. ' + totalSpent.toLocaleString();
            document.getElementById('displayTodaySpent').innerText = 'Rs. ' + todaySpent.toLocaleString();
            document.getElementById('displayDailyLimit').innerText = 'Daily Limit: Rs. ' + dLimit.toLocaleString();

            let rem = budget - totalSpent;
            document.getElementById('displayRemainingBudget').innerText = 'Remaining: Rs. ' + rem.toLocaleString();

            let percent = budget > 0 ? Math.min(100, Math.round((totalSpent / budget) * 100)) : 0;
            document.getElementById('budgetPercent').innerText = percent + '%';
            document.getElementById('progressBar').style.width = percent + '%';

            checkExpenseAlerts(todaySpent, dLimit);
            
            let searchVal = document.getElementById('searchTransaction').value.toLowerCase();
            let filteredExpenses = expenses.filter(item => 
                item.title.toLowerCase().includes(searchVal) || item.category.toLowerCase().includes(searchVal)
            );
            renderExpenseList(filteredExpenses);

            initSparklineChart(expenses);
            initTodayGaugeChart(todaySpent, dLimit);
            initPredictiveChart(expenses);
            initHealthGaugeChart(percent);
            initCategoryDoughnutChart(categoryTotals);
        }

        function checkExpenseAlerts(todaySpent, dailyLimit) {
            let banner = document.getElementById('alertBanner');
            let msg = document.getElementById('alertMessage');
            if (dailyLimit > 0 && todaySpent > dailyLimit) {
                banner.classList.remove('hidden');
                msg.innerText = `Today's expense (Rs. ${todaySpent}) has exceeded your daily limit (Rs. ${dailyLimit})!`;
            } else {
                banner.classList.add('hidden');
            }
        }

        function dismissAlert() {
            document.getElementById('alertBanner').classList.add('hidden');
        }

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            let title = document.getElementById('expTitle').value.trim();
            let amount = parseFloat(document.getElementById('expAmount').value);
            let category = document.getElementById('expCategory').value;

            let now = new Date();
            let newExp = {
                id: Date.now(),
                title: title,
                amount: amount,
                category: category,
                date: now.toLocaleDateString('en-GB')
            };

            currentuserDataCache.expenses.push(newExp);
            await saveUserDataToCloud();

            document.getElementById('expTitle').value = '';
            document.getElementById('expAmount').value = '';
            renderAllData();
        });

        function renderExpenseList(expenses) {
            let list = document.getElementById('expenseList');
            list.innerHTML = '';

            if (expenses.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-400 text-xs py-8">No expenses found.</p>`;
                return;
            }

            expenses.slice().reverse().forEach((item) => {
                let div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-slate-200/50 dark:bg-slate-900/80 p-3 rounded-xl border border-slate-300 dark:border-slate-800';
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-7 h-7 rounded-lg bg-purple-500/20 text-purple-500 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-receipt"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-semibold">${item.title}</h4>
                            <p class="text-[10px] text-slate-500 dark:text-slate-400">${item.category} • ${item.date}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-bold text-amber-500">-Rs. ${Number(item.amount).toLocaleString()}</span>
                        <button onclick="deleteExpense(${item.id})" class="text-slate-400 hover:text-rose-500 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function deleteExpense(id) {
            currentuserDataCache.expenses = currentuserDataCache.expenses.filter(e => e.id !== id);
            await saveUserDataToCloud();
            renderAllData();
        }

        async function clearAllExpenses() {
            if (confirm('Are you sure you want to clear all cloud expense records?')) {
                currentuserDataCache.expenses = [];
                await saveUserDataToCloud();
                renderAllData();
            }
        }

        function initSparklineChart(expenses) {
            const ctx = document.getElementById('sparklineChart').getContext('2d');
            if (chartInstances.sparkline) chartInstances.sparkline.destroy();

            let last7Days = [];
            let labels = [];
            for (let i = 6; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let dStr = d.toLocaleDateString('en-GB');
                labels.push(d.toLocaleDateString('en-US', { weekday: 'short' }));
                let dayTotal = expenses.filter(e => e.date === dStr).reduce((sum, e) => sum + Number(e.amount), 0);
                last7Days.push(dayTotal);
            }

            chartInstances.sparkline = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: last7Days,
                        borderColor: '#00f2fe',
                        borderWidth: 2,
                        tension: 0.4,
                        pointRadius: 2,
                        fill: true,
                        backgroundColor: 'rgba(0, 242, 254, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
        }

        function initTodayGaugeChart(spent, limit) {
            const ctx = document.getElementById('todayGaugeChart').getContext('2d');
            if (chartInstances.gauge) chartInstances.gauge.destroy();
            let percentage = limit > 0 ? Math.min(100, (spent / limit) * 100) : 0;

            chartInstances.gauge = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [percentage, Math.max(0, 100 - percentage)],
                        backgroundColor: ['#a855f7', '#334155'],
                        borderWidth: 0,
                    }]
                },
                options: {
                    rotation: -90,
                    circumference: 180,
                    cutout: '75%',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } }
                }
            });
        }

        function initPredictiveChart(expenses) {
            const ctx = document.getElementById('predictiveChart').getContext('2d');
            if (chartInstances.predictive) chartInstances.predictive.destroy();

            let totals = [0, 0, 0, 0, 0, 0, 0];
            expenses.forEach(e => {
                let dayIdx = new Date(e.date.split('/').reverse().join('-')).getDay();
                totals[dayIdx] += Number(e.amount);
            });

            chartInstances.predictive = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                    datasets: [
                        {
                            label: 'Actual Trend',
                            data: totals,
                            borderColor: '#00f2fe',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 3
                        },
                        {
                            label: 'Forecast',
                            data: totals.map(v => v ? v * 1.15 : 100),
                            borderColor: '#a855f7',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0.4,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { display: false } },
                        y: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: 'rgba(100,116,139,0.2)' } }
                    }
                }
            });
        }

        function initHealthGaugeChart(budgetPercent) {
            const ctx = document.getElementById('healthScoreGauge').getContext('2d');
            if (chartInstances.healthGauge) chartInstances.healthGauge.destroy();
            let healthScore = Math.max(0, 100 - budgetPercent);
            document.getElementById('healthScoreVal').innerText = healthScore;

            chartInstances.healthGauge = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [healthScore, 100 - healthScore],
                        backgroundColor: ['#00f2fe', '#334155'],
                        borderWidth: 0
                    }]
                },
                options: {
                    rotation: -90,
                    circumference: 180,
                    cutout: '80%',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } }
                }
            });
        }

        function initCategoryDoughnutChart(catData) {
            const ctx = document.getElementById('categoryDoughnutChart').getContext('2d');
            if (chartInstances.catDoughnut) chartInstances.catDoughnut.destroy();

            let labels = Object.keys(catData);
            let data = Object.values(catData);
            if (labels.length === 0) { labels = ['No Data']; data = [1]; }

            chartInstances.catDoughnut = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#00f2fe', '#a855f7', '#10b981', '#f59e0b', '#ec4899', '#6366f1'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '65%',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 9 } } } }
                }
            });
        }

        function openBudgetModal() {
            document.getElementById('inputMonthlyBudget').value = currentuserDataCache.monthlyBudget || '';
            document.getElementById('inputDailyLimit').value = currentuserDataCache.dailyLimit || '';
            document.getElementById('budgetModal').classList.remove('hidden');
            document.getElementById('budgetModal').classList.add('flex');
        }

        function closeBudgetModal() {
            document.getElementById('budgetModal').classList.add('hidden');
            document.getElementById('budgetModal').classList.remove('flex');
        }

        async function saveLimits() {
            let m = parseFloat(document.getElementById('inputMonthlyBudget').value) || 0;
            let d = parseFloat(document.getElementById('inputDailyLimit').value) || 0;

            currentuserDataCache.monthlyBudget = m;
            currentuserDataCache.dailyLimit = d;
            await saveUserDataToCloud();

            closeBudgetModal();
            renderAllData();
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('settingsModal').classList.add('flex');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('settingsModal').classList.remove('flex');
        }

        async function updatePassword() {
            let p = document.getElementById('newPasswordInput').value;
            if(!p) { alert('Please enter a new password!'); return; }
            currentuserDataCache.password = p;
            await saveUserDataToCloud();
            alert('Cloud password updated successfully!');
            document.getElementById('newPasswordInput').value = '';
            closeSettingsModal();
        }

        function exportCSV() {
            let expenses = currentuserDataCache.expenses;
            if (!expenses || expenses.length === 0) { alert('No data to export!'); return; }
            let csvContent = "data:text/csv;charset=utf-8,ID,Title,Category,Amount,Date\n";
            expenses.forEach(e => { csvContent += `${e.id},"${e.title}","${e.category}",${e.amount},${e.date}\n`; });
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${currentUser}_cloud_expenses.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        if (currentUser) {
            initDashboard();
        }
    </script>
